name: "✨ Feature request"
description: Suggest an improvement or new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / UX sketch
      description: How should it work? Feel free to add rough UI notes or links.
  - type: input
    id: impact
    attributes:
      label: Impact
      placeholder: "Who benefits? How often?"
