name: 💡 Share an Idea
description: Propose a new feature or improvement for this project
labels: ["enhancement", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea! Please provide details below:
  - type: textarea
    id: summary
    attributes:
      label: Idea Summary
      description: What’s your idea in a nutshell?
      placeholder: e.g. Add a countdown timer for baking reminders
  - type: textarea
    id: value
    attributes:
      label: Value
      description: Why would this be useful or fun?
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Any links, references, or inspirations?
